[project]
name = "panmvpa"
version = "0.1.0"
description = "Exploring the benefit of precision fMRI for multivariate analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "nibabel",
    "nilearn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
]

[project.scripts]
# Runnable from any directory, so the hub's data path (via $DATA_DIR) is the only
# location that matters.
panmvpa-run = "panmvpa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The working package lives under henrik_sidequest/, not src/. Pointing the build here
# is what makes `pip install -e .` from the repo root import the real code.
packages = ["henrik_sidequest/panmvpa"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
